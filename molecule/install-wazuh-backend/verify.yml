---
# Purpose: verify Wazuh backend deployment state
# Molecule calls this playbook with `molecule verify`
- name: Verify Wazuh Backend Deployment
  hosts: wazuh_backend
  gather_facts: false
  become: true
  vars:
    # Wazuh service names from docker-compose
    wazuh_services:
      - wazuh.manager
      - wazuh.indexer
      - wazuh.dashboard

    # Required listening ports
    wazuh_required_ports:
      - port: 5443    # Test var 'fabos_wazuh_default_compose_ports': Replace 443 with 5443 for Wazuh dashboard
      - port: 1514
      - port: 1515
      - port: 9200
      - port: 55000
  tasks:
    - name: Verify Wazuh containers are running
      ansible.builtin.shell: |
        docker ps --format "{{ "{{" }}.Names{{ "}}" }}"
      register: running_containers
      changed_when: false

    - name: Check that all Wazuh services are running
      ansible.builtin.assert:
        that:
          - running_containers.stdout_lines | select('search', item) | list | length > 0
        fail_msg: "Service {{ item }} is not running"
        success_msg: "Service {{ item }} is running"
      loop: "{{ wazuh_services }}"
      loop_control:
        label: "{{ item }}"

    - name: Verify Wazuh required ports are listening
      ansible.builtin.wait_for:
        port: "{{ item.port }}"
        timeout: 5
      loop: "{{ wazuh_required_ports }}"
      loop_control:
        label: "Port {{ item.port }}"
      register: port_check_result
      changed_when: false

    - name: Verify indexer retention policy exists
      ansible.builtin.uri:
        url: "https://localhost:9200/_plugins/_ism/policies/fabos-wazuh-retention"
        user: admin
        password: SecretPassword
        force_basic_auth: true
        validate_certs: false
      register: retention_policy
      failed_when: retention_policy.json.policy.states[1].actions[0].delete is not defined

    - name: Verify indexer disk watermarks are enabled
      ansible.builtin.uri:
        url: "https://localhost:9200/_cluster/settings?include_defaults=true&flat_settings=true"
        user: admin
        password: SecretPassword
        force_basic_auth: true
        validate_certs: false
      register: cluster_settings
      failed_when: cluster_settings.json.defaults[disk_threshold_setting] | default('') | string | lower != 'true'
      vars:
        disk_threshold_setting: cluster.routing.allocation.disk.threshold_enabled
