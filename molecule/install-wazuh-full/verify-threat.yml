- name: Verify - Agent Threat Detection
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    wazuh_backend_ip: "{{ hostvars[groups['wazuh_backend'][0]]['ansible_host'] }}"

    wazuh_client_manager_base_url: "https://{{ wazuh_backend_ip }}:55000"
    wazuh_client_manager_username: wazuh-wui
    wazuh_client_manager_password: MyS3cr37P450r.*-

    wazuh_client_indexer_base_url: "https://{{ wazuh_backend_ip }}:9200"
    wazuh_client_indexer_username: admin
    wazuh_client_indexer_password: SecretPassword
    wazuh_client_agent_ip: "{{ hostvars[groups['wazuh_agent'][0]]['ansible_host'] }}"
  tasks:
    - name: Get Wazuh manager access token
      ansible.builtin.include_role:
        name: eclipse-slm.wazuh_client
        tasks_from: get_manager_access_token

    - name: Wait for agent to be connected
      ansible.builtin.uri:
        url: "{{ wazuh_client_manager_base_url }}/agents?status=active&q=ip={{ wazuh_client_agent_ip }}"
        method: GET
        headers:
          Authorization: "Bearer {{ wazuh_client_manager_access_token }}"
        validate_certs: false
      register: wazuh_active_agents
      until: wazuh_active_agents.json.data.total_affected_items | int > 0
      retries: 30
      delay: 10

    - name: Create EICAR test file on agent
      ansible.builtin.raw: |
        printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
      delegate_to: "{{ groups['wazuh_agent'][0] }}"
      become: true

    # Same query as eclipse-slm.wazuh_client get_alerts_by_agent_ip, inlined because include_role cannot be retried
    - name: Wait for alerts of agent
      ansible.builtin.uri:
        url: "{{ wazuh_client_indexer_base_url }}/wazuh-alerts-*/_search"
        method: GET
        user: "{{ wazuh_client_indexer_username }}"
        password: "{{ wazuh_client_indexer_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          query:
            bool:
              filter:
                - range:
                    rule.level:
                      gte: 12
                - term:
                    agent.ip: "{{ wazuh_client_agent_ip }}"
          sort:
            - timestamp:
                order: desc
      register: get_alerts_response
      until: get_alerts_response.json.hits.total.value | default(0) | int > 0
      retries: 30
      delay: 10

    - name: Set Alerts
      ansible.builtin.set_fact:
        wazuh_client_alerts: "{{ get_alerts_response.json }}"

    - name: Print detected Alert count
      ansible.builtin.debug:
        msg: "'{{ wazuh_client_alerts.hits.total.value }}' alerts have been found."

    - name: Assert EICAR alert is present
      ansible.builtin.assert:
        that:
          - alert_count > 0
          - "'EICAR' in rule_description"
        fail_msg: "EICAR alert not found in alerts."
      vars:
        alert_count: "{{ wazuh_client_alerts.hits.total.value }}"
        rule_description: "{{ wazuh_client_alerts.hits.hits[0]._source.rule.description }}"

    - name: Delete EICAR Testfile
      ansible.builtin.file:
        path: "/tmp/eicar.com"
        state: absent
      delegate_to: "{{ groups['wazuh_agent'][0] }}"
      become: true

    - name: Delete Alerts of agent
      ansible.builtin.include_role:
        name: eclipse-slm.wazuh_client
        tasks_from: delete_alerts_by_agent_ip
