---
# Purpose: bring the instance to the desired state by running the role under test.
# Molecule calls this playbook with `molecule converge`.
- name: Converge - Backend
  hosts: wazuh_backend
  gather_facts: true
  become: true
  vars:
    fabos_wazuh_service: backend
    fabos_wazuh_service_state: present
    fabos_wazuh_default_compose_ports:
      - container_port: 5601
        exposed_port: 5443
  tasks:
    - name: Include wazuh role
      ansible.builtin.include_role:
        name: wazuh

- name: Converge - Agent
  hosts: wazuh_agent
  gather_facts: true
  become: true
  vars:
    fabos_wazuh_service: agent
    fabos_wazuh_service_state: present
    fabos_wazuh_manager_ip: "{{ hostvars[groups['wazuh_backend'][0]].ansible_host }}"
    fabos_wazuh_agent_labels:
      test_label_1: test_value_1
      test_label_2: test_value_2
  tasks:
    - name: Include wazuh role
      ansible.builtin.include_role:
        name: wazuh
