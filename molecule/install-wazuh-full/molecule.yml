---
# Dependency management (download roles/collections)
dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml

platforms:
  - name: ansible-role-wazuh-wazuh-backend
    image: quay.io/containerdisks/ubuntu:24.04
    volume_size: 40Gi
    instancetype: u1.large
    groups: ["wazuh_backend"]

  - name: ansible-role-wazuh-wazuh-agent-1
    image: quay.io/containerdisks/ubuntu:24.04
    volume_size: 25Gi
    instancetype: u1.large
    groups: ["wazuh_agent"]

  - name: ansible-role-wazuh-wazuh-agent-2
    image: quay.io/containerdisks/ubuntu:24.04
    volume_size: 25Gi
    instancetype: u1.large
    groups: ["wazuh_agent"]

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers
        - --inventory=/path/to/inventory.yml
      ansible_navigator:
        - --mode stdout
        - --pull-policy missing
        - --execution-environment-image ghcr.io/ansible/community-ansible-dev-tools:latest

  playbooks:
    create: ../default/create-kv.yml
    destroy: ../default/destroy-kv.yml
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml

scenario:
  name: install-wazuh-full
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
